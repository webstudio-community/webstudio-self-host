services:
  # pgsty/silo: maintained MinIO fork (minio/minio is no longer on Docker Hub), same variables.
  minio:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    # amd64+arm64 digest: sha256:2636fc4155d9a7e41ff58cdb65ddd13ba9304e67184e13c25bc5cb34016269d7
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
  minio-init:
    # Same image as the server: ships mc, curl and a shell.
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-webstudio-assets}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD
        mc mb --ignore-existing local/$$S3_BUCKET
        mc anonymous set download local/$$S3_BUCKET
        echo 'Bucket ready.'
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: webstudio
    volumes:
      - db-data:/var/lib/postgresql/data
    configs:
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  postgrest:
    image: postgrest/postgrest:v12.2.0
    restart: always
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/webstudio
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_DB_SCHEMAS: public
  # Grants "anon" access to tables created before the init SQL's DEFAULT PRIVILEGES.
  db-setup:
    image: postgres:15-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql "postgresql://postgres:$$POSTGRES_PASSWORD@db:5432/webstudio" \
          -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF; END \$\$;" \
          -c "GRANT USAGE ON SCHEMA public TO anon;" \
          -c "GRANT ALL ON ALL TABLES IN SCHEMA public TO anon;" \
          -c "GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO anon;" \
          -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon;" \
          -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO anon;"
  migrate:
    image: ${BUILDER_IMAGE:-ghcr.io/webstudio-community/builder:latest}
    restart: "no"
    depends_on:
      db-setup:
        condition: service_completed_successfully
    entrypoint:
      - /prisma/node_modules/.bin/prisma
      - migrate
      - deploy
      - --schema=/app/prisma/schema.prisma
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/webstudio
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/webstudio
  # 4000: build API (internal). 4001: proxy serving every published site.
  publisher:
    image: ${PUBLISHER_IMAGE:-ghcr.io/webstudio-community/webstudio-publisher:latest}
    restart: always
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:4001"
    environment:
      TRPC_SERVER_API_TOKEN: ${TRPC_SERVER_API_TOKEN}
      PUBLISHER_HOST: ${PUBLISHER_HOST:-}
      BUILDER_INTERNAL_URL: http://app:3000
      PROXY_PORT: "4001"
      PUBLISH_LOG_RETENTION: ${PUBLISH_LOG_RETENTION:-5}
      # Optional Traefik file-provider directory (e.g. /etc/traefik/dynamic): enables
      # Let's Encrypt for custom domains. Also bind-mount it read-write below.
      TRAEFIK_DYNAMIC_DIR: ${TRAEFIK_DYNAMIC_DIR:-}
      # Optional: "Coolify (remote)" hosting, see .env.example.
      REGISTRY_URL: ${REGISTRY_URL:-}
      REGISTRY_USER: ${REGISTRY_USER:-}
      REGISTRY_TOKEN: ${REGISTRY_TOKEN:-}
    volumes:
      - published-sites:/var/publish
      - publisher-work:/var/work
      # Required for SSR and "Coolify (remote)" (docker build / push):
      # - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
  app:
    image: ${BUILDER_IMAGE:-ghcr.io/webstudio-community/builder:latest}
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGREST_URL: http://postgrest:3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/webstudio
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/webstudio
      AUTH_SECRET: ${AUTH_SECRET}
      DEV_LOGIN: ${DEV_LOGIN:-}
      DEV_LOGIN_EMAIL: ${DEV_LOGIN_EMAIL:-}
      GH_CLIENT_ID: ${GH_CLIENT_ID:-}
      GH_CLIENT_SECRET: ${GH_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      DEPLOYMENT_URL: ${DEPLOYMENT_URL:-}
      ALLOW_INSECURE_COOKIES: ${ALLOW_INSECURE_COOKIES:-}
      AUTH_WS_CLIENT_ID: ${AUTH_WS_CLIENT_ID:-self-hosted}
      AUTH_WS_CLIENT_SECRET: ${AUTH_WS_CLIENT_SECRET}
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-5}
      PUBLISHER_HOST: ${PUBLISHER_HOST:-}
      FEATURES: ${FEATURES:-*}
      USER_PLAN: ${USER_PLAN:-Pro}
      MAX_ASSETS_PER_PROJECT: ${MAX_ASSETS_PER_PROJECT:-50}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-webstudio-assets}
      ENTRI_APPLICATION_ID: ${ENTRI_APPLICATION_ID:-webstudio}
      ENTRI_SECRET: ${ENTRI_SECRET:-}
      TRPC_SERVER_API_TOKEN: ${TRPC_SERVER_API_TOKEN:-}
      SELF_HOSTED_PUBLISHER_URL: ${SELF_HOSTED_PUBLISHER_URL:-http://publisher:4000}
    volumes:
      - uploads:/app/public/s/uploads

configs:
  postgres_init:
    content: |
      CREATE SCHEMA IF NOT EXISTS extensions;
      CREATE EXTENSION IF NOT EXISTS "uuid-ossp" SCHEMA extensions;
      ALTER DATABASE webstudio SET search_path TO "$$user", public, extensions;
      CREATE ROLE anon NOLOGIN;
      GRANT USAGE ON SCHEMA public TO anon;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO anon;

volumes:
  db-data:
  uploads:
  minio-data:
  published-sites:
  publisher-work:
